<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Panel de Administración</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Estilos propios -->
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="login-body">

  <main class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">

        <div class="card shadow-lg border-0 login-card">
          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
              <i class="bi bi-speedometer2 login-logo"></i>
              <h1 class="h4 mt-2 mb-1">Panel de Administración</h1>
              <p class="text-muted small mb-0">Ingresa tus credenciales para continuar</p>
            </div>

            <div id="loginError" class="alert alert-danger d-none py-2" role="alert">
              Usuario o contraseña incorrectos.
            </div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="usuario" placeholder="admin" required>
                  <div class="invalid-feedback">Ingresa tu usuario.</div>
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Mostrar contraseña">
                    <i class="bi bi-eye"></i>
                  </button>
                  <div class="invalid-feedback">Ingresa tu contraseña.</div>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="recordarme">
                  <label class="form-check-label small" for="recordarme">Recordarme</label>
                </div>
                <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
              </button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
              Demo: <code>admin</code> / <code>admin123</code>
            </p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JS propio -->
  <script src="js/admin.js"></script>
</body>
</html>
